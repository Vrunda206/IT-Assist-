{% extends "base.html" %}
{% block title %}{{ 'Edit' if asset.asset_id else 'Add' }} Asset{% endblock %}
{% block heading %}{{ 'Edit Asset' if asset.asset_id else 'Add Asset' }}{% endblock %}
{% block content %}
<div class="box" style="max-width:900px">
  <form method="post" class="row g-3">
    <div class="col-md-4"><label class="form-label">Asset tag *</label><input name="asset_tag" class="form-control" value="{{ asset.asset_tag or '' }}" required></div>
    <div class="col-md-8"><label class="form-label">Asset name *</label><input name="asset_name" class="form-control" value="{{ asset.asset_name or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Category *</label><select name="category_id" class="form-select" required>
      {% for c in categories %}<option value="{{ c.category_id }}" {{ 'selected' if asset.category_id == c.category_id }}>{{ c.category_name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Vendor</label><select name="vendor_id" class="form-select"><option value="">— none —</option>
      {% for v in vendors %}<option value="{{ v.vendor_id }}" {{ 'selected' if asset.vendor_id == v.vendor_id }}>{{ v.vendor_name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Status *</label><select name="status" class="form-select">
      {% for s in statuses %}<option {{ 'selected' if asset.status == s }}>{{ s }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Brand</label><input name="brand" class="form-control" value="{{ asset.brand or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Model</label><input name="model" class="form-control" value="{{ asset.model or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Serial number *</label><input name="serial_number" class="form-control" value="{{ asset.serial_number or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Purchase date *</label><input type="date" name="purchase_date" class="form-control" value="{{ asset.purchase_date or '' }}" data-today required></div>
    <div class="col-md-4"><label class="form-label">Purchase cost (₹) *</label><input type="number" step="0.01" min="0" name="purchase_cost" class="form-control" value="{{ asset.purchase_cost or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Warranty expiry</label><input type="date" name="warranty_expiry" class="form-control" value="{{ asset.warranty_expiry or '' }}"></div>
    <div class="col-12"><label class="form-label">Location</label><input name="location" class="form-control" value="{{ asset.location or '' }}"></div>
    <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Save asset</button><a href="/assets" class="btn btn-outline-secondary">Cancel</a></div>
  </form>
</div>
{% endblock %}
