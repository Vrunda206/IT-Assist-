<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | IT Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand text-dark mb-1"><i class="bi bi-hdd-network text-primary"></i> IT Assist</div>
    <p class="text-muted">Inventory Management System</p>
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-danger py-2">{{ msg }}</div>
    {% endfor %}
    <form method="post">
      <label class="form-label">Username</label>
      <input name="username" class="form-control mb-3" required autofocus>
      <label class="form-label">Password</label>
      <input name="password" type="password" class="form-control mb-3" required>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
    <div class="demo-note mt-3"><i class="bi bi-info-circle"></i> Demo login for this academic project:
      <b>admin</b> / <b>admin123</b></div>
  </div>
</body>
</html>
